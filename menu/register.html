<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - TaskAcademic</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body data-on="true" data-color="amber">

    <!-- Canvas Partikel Debu Cahaya -->
    <canvas id="dustCanvas"></canvas>

    <!-- Ambient Glow Latar Belakang Ruangan -->
    <div class="ambient-glow"></div>

    <!-- Quick Controls (Tombol Warna Lampu & Tombol Speaker / Suara) -->
    <div class="quick-controls">
        <div class="color-palette" id="colorPalette" title="Choose Lamp Color">
            <button class="color-dot-btn active" data-color="amber" style="--dot-color: #ffab3d;" aria-label="Amber Light" title="Amber (Warm)"></button>
            <button class="color-dot-btn" data-color="cyan" style="--dot-color: #00f0ff;" aria-label="Cyan Light" title="Cyan (Cyber)"></button>
            <button class="color-dot-btn" data-color="rose" style="--dot-color: #ff3385;" aria-label="Rose Light" title="Rose (Sunset)"></button>
            <button class="color-dot-btn" data-color="mint" style="--dot-color: #00e676;" aria-label="Mint Light" title="Mint (Emerald)"></button>
            <button class="color-dot-btn" data-color="moonlight" style="--dot-color: #d8e5ff;" aria-label="Moonlight" title="Moonlight (Cool White)"></button>
        </div>

        <button class="sound-toggle" id="soundToggle" title="Toggle Sound" aria-label="Toggle Sound">
            <svg class="sound-icon sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="sound-icon sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        </button>
    </div>

    <div class="scene-container">
        
        <!-- Panggung Lampu Gantung Interaktif -->
        <div class="lamp-stage">
            <div class="lamp-wrapper">
                <svg class="lamp-svg" viewBox="0 0 400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g class="svg-light-beam">
                        <path d="M 215 175 L -120 520 L 550 520 Z" fill="url(#beamGrad)" />
                    </g>

                    <defs>
                        <linearGradient id="beamGrad" x1="215" y1="175" x2="215" y2="520" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="var(--beam-start)" />
                            <stop offset="35%" stop-color="var(--beam-mid)" />
                            <stop offset="100%" stop-color="var(--beam-far)" stop-opacity="0" />
                        </linearGradient>
                        <radialGradient id="bulbGlowGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="var(--lamp-glow)" stop-opacity="1" />
                            <stop offset="40%" stop-color="var(--lamp-accent)" stop-opacity="0.8" />
                            <stop offset="100%" stop-color="var(--lamp-accent)" stop-opacity="0" />
                        </radialGradient>
                    </defs>

                    <path d="M 215 0 L 215 120" stroke="#1f242d" stroke-width="3" stroke-linecap="round" />
                    <rect x="202" y="120" width="26" height="18" rx="4" fill="#2b313c" />
                    
                    <g id="shadeAssembly">
                        <path d="M 140 155 Q 215 135 290 155 L 340 205 Q 215 215 90 205 Z" fill="#181c24" stroke="rgba(255,255,255,0.08)" stroke-width="2" class="lamp-shade-body" />
                        <ellipse cx="215" cy="205" rx="125" ry="18" fill="#12151b" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
                        
                        <ellipse cx="215" cy="203" rx="116" ry="13" fill="#1a1e27" class="shade-reflector-off" />
                        <ellipse cx="215" cy="203" rx="116" ry="13" fill="var(--lamp-glow)" class="shade-reflector-on" />

                        <circle cx="215" cy="216" r="18" fill="url(#bulbGlowGrad)" class="bulb-glow-core" />
                        <path d="M 209 210 Q 215 204 221 210 Q 224 218 215 222 Q 206 218 209 210 Z" stroke="#555" stroke-width="2.2" stroke-linecap="round" class="bulb-filament" />
                    </g>

                    <path id="elasticCord" class="elastic-cord-path" d="M 245 212 Q 245 256 245 300" stroke="#333942" stroke-width="2.2" stroke-linecap="round" />

                    <g id="cordBead" class="cord-bead-group" transform="translate(245, 300)">
                        <circle cx="0" cy="0" r="26" fill="var(--lamp-accent)" opacity="0.15" class="bead-aura" />
                        <circle cx="0" cy="0" r="14" fill="#1c212a" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />
                        <circle cx="-3" cy="-3" r="3.5" fill="rgba(255,255,255,0.35)" />
                    </g>
                    <circle id="cordHit" cx="245" cy="300" r="24" fill="transparent" style="cursor: pointer;" />
                </svg>
                
                <div class="cord-tooltip" id="cordTooltip">
                    <div class="tooltip-arrow"></div>
                    Tarik atau klik tali untuk matikan/nyalakan
                </div>
            </div>
        </div>

        <!-- Panggung Formulir Registrasi -->
        <div class="form-stage">
            <div class="login-card" id="loginCard">
                <div class="card-header">
                    <h2 class="card-title">Daftar Akun</h2>
                    <p class="card-subtitle">Buat akun baru untuk mulai merencanakan aktivitasmu</p>
                </div>
                
                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-username">Email</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user field-icon"></i>
                            <input type="text" id="reg-username" placeholder="Masukkan email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input type="password" id="reg-password" placeholder="Buat password aman" required>
                            
                            <!-- Tombol Lihat/Sembunyikan Password -->
                            <button type="button" class="eye-toggle" id="eyeToggleRegister" aria-label="Toggle password visibility">
                                <svg class="eye-icon eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-icon eye-hide hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <div class="btn-glow-layer"></div>
                        <div class="btn-content">
                            <span class="btn-text">Daftar Sekarang</span>
                            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            <div class="btn-spinner hidden" id="btnSpinner"></div>
                            <svg class="btn-success-icon hidden" id="btnSuccess" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                    </button>

                    <div class="auth-divider">
                        <span class="divider-line"></span>
                        <span class="divider-text">atau melanjutkan dengan</span>
                        <span class="divider-line"></span>
                    </div>

                    <div class="social-row">
                        <button type="button" class="social-btn" title="Sign in with Google" aria-label="Sign in with Google">
                          <svg viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.5 8.9 5 12 5z" />
                            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" />
                            <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.6 6.4C.6 8.3 0 10.1 0 12s.6 3.7 1.6 5.6l3.7-2.9z" />
                            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.5-6.7-5.3L1.6 16c1.9 3.8 5.8 7 10.4 7z" />
                          </svg>
                        </button>
                    </div>
                </form>

                <div class="auth-redirect" style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                    <p>Sudah punya akun? <a href="../index.html" style="color: var(--lamp-accent); font-weight: 600; text-decoration: none;">Login di sini</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- GSAP Library & Script Utama -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="../javascript/script.js"></script>
</body>
</html>
